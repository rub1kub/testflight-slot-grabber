name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build Swift helper and mock
        run: swift build -c release
      - name: Swift self-test
        run: .build/release/testflight-ax self-test --json
